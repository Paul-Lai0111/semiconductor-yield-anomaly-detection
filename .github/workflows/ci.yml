name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # Serving overlay stays out of pyproject/uv.lock: both are inside the frozen source hashes.
      - run: uv pip install -r requirements-service.txt
      - run: uv run ruff check .
      - run: uv run ruff check --isolated --select E,F,I,B,UP --ignore E501 --target-version py312 smartfab fabops dashboard
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fab-monitor .
      - name: Smoke-test the API container
        run: |
          docker run -d --name api -p 8000:8000 fab-monitor
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health | grep '"bundle_loaded":true'
          curl -fs localhost:8000/model | grep v3_winner
