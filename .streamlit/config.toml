# Yield Wafer Map world: polished-silicon ground, graphite ink and rail, bin colours carry state.
[theme]
base = "light"
primaryColor = "#1E2328"
backgroundColor = "#E4E7EA"
secondaryBackgroundColor = "#F4F6F7"
textColor = "#1E2328"
borderColor = "#CBD1D6"
showWidgetBorder = true
baseRadius = "6px"
linkColor = "#1E2328"
linkUnderline = true
redColor = "#C43C3C"
greenColor = "#2F8F4E"
orangeColor = "#B8741A"
yellowColor = "#B8741A"
blueColor = "#4A6A8A"
grayColor = "#5B656E"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
headingFont = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
baseFontSize = 15
headingFontWeights = [700, 650, 600]
headingFontSizes = ["2rem", "1.375rem", "1.125rem"]
dataframeHeaderBackgroundColor = "#E4E7EA"
dataframeBorderColor = "#CBD1D6"
chartCategoricalColors = ["#1E2328", "#C9851F", "#4A6A8A", "#9AA3AB"]

[theme.sidebar]
backgroundColor = "#1E2328"
secondaryBackgroundColor = "#2B3238"
textColor = "#E6EAED"
primaryColor = "#A9D3B4"
borderColor = "#3A424A"
linkColor = "#E6EAED"

[server]
headless = true
